<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个 Git 页面</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, #000000 58%);
      color: #f5f5f5;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 40px 32px;
      text-align: center;
      background: #111113;
      border: 1px solid #27272a;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #c7d2fe;
      background: #1e1b4b;
      border: 1px solid #3730a3;
      border-radius: 999px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 24px;
      font-size: 15px;
      line-height: 1.7;
      color: #a1a1aa;
    }

    button {
      padding: 12px 22px;
      font: inherit;
      font-weight: 700;
      color: #ffffff;
      background: #4f46e5;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: #6366f1;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(1px);
    }

    #result {
      margin-top: 18px;
      font-size: 14px;
      color: #5eead4;
      font-weight: 600;
    }

    code {
      padding: 2px 6px;
      font-size: 13px;
      color: #fda4af;
      background: #2a1218;
      border-radius: 4px;
    }

    .hint {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px dashed #27272a;
      font-size: 12px;
      color: #71717a;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">GIT PRACTICE</span>
    <h1>你好，Git！</h1>
    <p>
      这是一个可以直接打开的简单 HTML 页面。<br>
      修改它，然后用 <code>git add</code> 和 <code>git commit</code> 记录你的改动。
	你好，朋友？
你好，我是v
    </p>

    <button id="actionButton" type="button">点我一下</button>
    <p id="result" role="status">还没有点击。</p>

    <p class="hint">
      练习：改标题 → 保存 → <code>git status</code> → <code>git add index.html</code>
      → <code>git commit -m "修改标题"</code>
    </p>
  </main>

  <script>
    const button = document.getElementById("actionButton");
    const result = document.getElementById("result");
    let count = 0;

    button.addEventListener("click", () => {
      count += 1;
      result.textContent = `你点了 ${count} 次，页面运行正常。`;
    });
  </script>
</body>
</html>
